# TOTEM – RMK v0.9.0 config
# Three Seeed XIAO nRF52840 (XIAO BLE) boards:
#   totem_dongle  = split central, USB to the host, SSD1306 128x64 OLED (DEBO OLED2 0.96)
#   totem_left    = split peripheral 0
#   totem_right   = split peripheral 1
#
# XIAO pin -> nRF pin:
#   D0=P0_02  D1=P0_03  D2=P0_28  D3=P0_29  D4=P0_04  D5=P0_05
#   D6=P1_11  D7=P1_12  D8=P1_13  D9=P1_14  D10=P1_15

[keyboard]
name = "TOTEM"
product_name = "TOTEM"
manufacturer = "GEIGEIGEIST"
vendor_id = 0x4c4b
product_id = 0x4654
board = "XIAO BLE"

# Rynk (RMK's native configurator protocol) instead of Vial.
# Must match the `rynk` Cargo feature in Cargo.toml.
[host]
vial_enabled = false
rynk_enabled = true
# Hold these two keys (matrix row, col) to unlock Rynk's "locked" operations
# (bootloader, settings reset, key tester): Q + top-right key.
unlock_keys = [[0, 0], [0, 9]]

[layout]
# 4 key rows + row 4, which holds only the dongle's 1x1 dummy matrix.
rows = 5
cols = 10
# Order = order of keys in every [[keymap.layer]] (38 keys).
# Same as the ZMK matrix transform: row 2 starts/ends with the outer pinky keys (3,0)/(3,9).
map = """
          (0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L)   (0,5,R) (0,6,R) (0,7,R) (0,8,R) (0,9,R)
          (1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L)   (1,5,R) (1,6,R) (1,7,R) (1,8,R) (1,9,R)
  (3,0,L) (2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L)   (2,5,R) (2,6,R) (2,7,R) (2,8,R) (2,9,R) (3,9,R)
                          (3,2,L) (3,3,L) (3,4,L)   (3,5,R) (3,6,R) (3,7,R)
"""

# ───────────────────────── Split / hardware ─────────────────────────

[split]
connection = "ble"

# Dongle (central). keyboard.toml requires a matrix on every split board, so the
# dongle gets a 1x1 dummy matrix on D0/D1. Leave unwired, or put a button + diode
# between D1 (col) and D0 (row) if you want a key there.
[split.central]
rows = 1
cols = 1
row_offset = 4
col_offset = 0

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_02"]
col_pins = ["P0_03"]

# DEBO OLED2 0.96 (SSD1306, 128x64, I2C 0x3C): VCC->3V3, GND->GND, SDA->D4, SCL->D5
[split.central.display]
driver = "ssd1306"
size = "128x64"
rotation = 0
renderer = "OledRenderer"
min_render_interval = 33

[split.central.display.protocol.i2c]
instance = "TWISPI0"
sda = "P0_04"
scl = "P0_05"
address = 0x3C

# Left half (peripheral 0). col2row (RMK default) like the ZMK shield.
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]        # D0 D1 D2 D3
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"] # D4 D5 D10 D9 D8

# Right half (peripheral 1). Columns reversed, like totem_right.overlay.
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]        # D0 D1 D2 D3
col_pins = ["P1_13", "P1_14", "P1_15", "P0_05", "P0_04"] # D8 D9 D10 D5 D4

[ble]
enabled = true

[storage]
# Set to true for ONE flash when coming from ZMK (wipes old bonds/settings),
# then set back to false and flash again.
clear_storage = false

# ───────────────────────── Behavior ─────────────────────────

[rmk]
combo_max_num = 8
combo_max_length = 4

# ZMK &mt: tapping-term 200ms, tap-preferred, quick-tap 150ms, global-quick-tap.
#   tap-preferred     -> normal mode (hold only after the timeout)
#   quick-tap-ms      -> quick_tap_timeout
#   global-quick-tap  -> flow tap with prior_idle_time
[behavior.morse]
enable_flow_tap = false
prior_idle_time = "150ms"
hold_timeout = "200ms"
gap_timeout = "200ms"

[behavior.morse.profiles]
# Home-row mods (all &mt keys)
HRM = { enable_flow_tap = true, normal_mode = true, hold_timeout = "200ms", gap_timeout = "200ms", quick_tap_timeout = "150ms" }

# ZMK combos are position based; RMK combos match the key actions, so the
# actions below are exactly what sits at those positions on the base layer.
# RMK has one global timeout (ZMK had 50ms for Esc, 100ms for left Enter).
[behavior.combo]
timeout = "50ms"
combos = [
  # Q + W -> Esc
  { actions = ["Q", "W"], output = "Escape" },
  # R + S + T -> Enter
  { actions = ["MT(R, RCtrl, HRM)", "MT(S, RAlt, HRM)", "MT(T, LGui, HRM)"], output = "Enter" },
  # N + E + I -> Enter
  { actions = ["MT(N, RGui, HRM)", "MT(E, LAlt, HRM)", "MT(I, LCtrl, HRM)"], output = "Enter" },
  # both outer pinky keys -> Caps Lock (right one is now RShift so the two differ)
  { actions = ["LShift", "RShift"], output = "CapsLock" },
]

# ───────────────────────── Keymap ─────────────────────────
# ZMK -> RMK: &kp X -> X, &mt M K -> MT(K, M, HRM), &lt n K -> LT(n, K),
# &mo/&to n -> MO/TO(n), &none -> No, &trans -> _, &caps_word -> CapsWordToggle

[[keymap.layer]]
name = "c_base"
keys = """
         Q                  W                  F                  P                  G            J          L                  U                  Y                  Insert
         MT(A, LShift, HRM) MT(R, RCtrl, HRM)  MT(S, RAlt, HRM)   MT(T, LGui, HRM)   D            H          MT(N, RGui, HRM)   MT(E, LAlt, HRM)   MT(I, LCtrl, HRM)  MT(O, RShift, HRM)
  LShift Z                  X                  C                  V                  B            K          M                  Comma              Dot                Escape  RShift
                                               LT(5, Delete)      Backspace          LT(1, Enter) LT(2, Tab) LT(4, Space)       MO(3)
"""

[[keymap.layer]]
name = "brackets"
# &kt LEFT_GUI (key toggle) has no RMK equivalent -> plain LGui for now
keys = """
         Kc1             Kc2          Kc3                   Kc4             Kc5              Kc6          Kc7             Kc8                    Kc9           Kc0
         Quote           LeftBracket  SHIFTED(LeftBracket)  SHIFTED(Kc9)    SHIFTED(Comma)   SHIFTED(Dot) SHIFTED(Kc0)    SHIFTED(RightBracket)  RightBracket  SHIFTED(Quote)
  LShift CapsWordToggle  No           Home                  No              LGui             No           No              Semicolon              SHIFTED(Semicolon) TO(0) RShift
                                      No                    _               No               _            TO(1)           Enter
"""

[[keymap.layer]]
name = "sym_rest"
keys = """
     No              No     No              No                  No           No     No     No     No              No
     SHIFTED(Slash)  Minus  SHIFTED(Minus)  SHIFTED(Backslash)  Backslash    Slash  Equal  Minus  SHIFTED(Equal)  Quote
  No No              No     No              No                  No           No     No     No     No              TO(0) No
                            No              TO(2)               Delete       No     _      No
"""

[[keymap.layer]]
name = "sym_top"
keys = """
     No            No            No            No            No              No            No            No            No     No
     SHIFTED(Kc1)  SHIFTED(Kc2)  SHIFTED(Kc3)  SHIFTED(Kc4)  SHIFTED(Kc5)    SHIFTED(Kc6)  SHIFTED(Kc7)  SHIFTED(Kc8)  Grave  No
  No No            No            No            No            No              No            No            No            No     TO(0) No
                                 No            TO(3)         No              No            No            No
"""

[[keymap.layer]]
name = "f_and_arr"
keys = """
     No  No    Up     No     No     F10  F7  F8  F9  No
     No  Left  Down   Right  No     F11  F4  F5  F6  No
  No No  No    No     No     No     F12  F1  F2  F3  TO(0) No
               No     TO(4)  No     No   No  No
"""

[[keymap.layer]]
name = "numpad"
keys = """
     No  No     No     No     No       No        Kp7    Kp8  Kp9  No
     No  TO(5)  TO(6)  No     No       PageUp    Kp4    Kp5  Kp6  Kp0
  No No  TO(1)  TO(2)  TO(4)  No       PageDown  Kp1    Kp2  Kp3  TO(0) No
                No     No     No       No        TO(5)  Kp0
"""

[[keymap.layer]]
name = "qwerty"
# ZMK had "&mt INSERT RIGHT_GUI" (hold Insert, tap RGui) -> TH(RGui, Insert)
keys = """
         Q  W                 E                  R                 T       Y       U                 I                  O                 P
         A  MT(S, LAlt, HRM)  MT(D, LCtrl, HRM)  MT(F, LGui, HRM)  G       H       MT(J, RGui, HRM)  MT(K, RCtrl, HRM)  MT(L, RAlt, HRM)  TH(RGui, Insert, HRM)
  LShift Z  X                 C                  V                 B       N       M                 Comma              Dot               TO(0)  LShift
                              LT(5, Enter)       Backspace         MO(1)   MO(2)   LT(4, Space)      LT(3, Tab)
"""
