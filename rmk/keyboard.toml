# TOTEM – RMK v0.9.0 config
# Three Seeed XIAO nRF52840 (XIAO BLE) boards:
#   totem_dongle  = split central, USB to the host, SSD1306 128x64 OLED (DEBO OLED2 0.96)
#   totem_left    = split peripheral 0
#   totem_right   = split peripheral 1
#
# XIAO pin -> nRF pin:
#   D0=P0_02  D1=P0_03  D2=P0_28  D3=P0_29  D4=P0_04  D5=P0_05
#   D6=P1_11  D7=P1_12  D8=P1_13  D9=P1_14  D10=P1_15

[keyboard]
name = "TOTEM"
product_name = "TOTEM"
manufacturer = "GEIGEIGEIST"
vendor_id = 0x4c4b
product_id = 0x4654
board = "XIAO BLE"

# Rynk (RMK's native configurator protocol) instead of Vial.
# Must match the `rynk` Cargo feature in Cargo.toml.
[host]
vial_enabled = false
rynk_enabled = true
# Hold these two keys (matrix row, col) to unlock Rynk's "locked" operations
# (bootloader, settings reset, key tester): Q + top-right key.
unlock_keys = [[0, 0], [0, 9]]

[layout]
# 4 key rows + row 4, which holds only the dongle's 1x1 dummy matrix.
rows = 5
cols = 10
# Order = order of keys in every [[keymap.layer]] (38 keys).
# Hand: L/R = side used by `unilateral_tap`; `*` (bilateral) on the thumbs so
# holding a layer thumb key never cancels a home-row mod held on the same side.
# Same as the ZMK matrix transform: row 2 starts/ends with the outer pinky keys (3,0)/(3,9).
#
# Whitespace in `map` is ignored; the physical geometry (sent to hosts over
# Rynk, e.g. totem-viewer) comes from the `[n]` gaps and the @shapes below,
# taken from docs/images/TOTEM_layout.svg.
map = """
[1.0]   (0,0,L,@pL) (0,1,L,@rL) (0,2,L) (0,3,L,@i) (0,4,L,@x)  [2.3]  (0,5,R,@x) (0,6,R,@i) (0,7,R) (0,8,R,@rR) (0,9,R,@pR)
[1.0]   (1,0,L,@pL) (1,1,L,@rL) (1,2,L) (1,3,L,@i) (1,4,L,@x)  [2.3]  (1,5,R,@x) (1,6,R,@i) (1,7,R) (1,8,R,@rR) (1,9,R,@pR)
(3,0,L,@oL) (2,0,L,@pL) (2,1,L,@rL) (2,2,L) (2,3,L,@i) (2,4,L,@x)  [2.3]  (2,5,R,@x) (2,6,R,@i) (2,7,R) (2,8,R,@rR) (2,9,R,@pR) (3,9,R,@oR)
[3.8]   (3,2,*,@t1) (3,3,*,@t2L) (3,4,*,@t3L)  [0.78]  (3,5,*,@t3R) (3,6,*,@t2R) (3,7,*,@t1)
"""

# Column stagger / rotation, as offsets (key units) from the plain grid.
# p = pinky, r = ring, i = index, x = inner index, o = outer pinky, t = thumbs.
[layout.shapes]
pL  = { y = 1.40, r = -10 }
pR  = { y = 1.40, r = 10 }
rL  = { y = 0.55, r = -4 }
rR  = { y = 0.55, r = 4 }
i   = { y = 0.45 }
x   = { y = 0.60 }
oL  = { y = 1.05, r = -10 }
oR  = { y = 1.05, r = 10 }
t1  = { y = 0.50 }
t2L = { x = 0.10, y = 0.65, r = 15 }
t2R = { x = -0.10, y = 0.65, r = -15 }
t3L = { x = 0.15, y = 1.05, r = 30 }
t3R = { x = -0.15, y = 1.05, r = -30 }

# ───────────────────────── Split / hardware ─────────────────────────

[split]
connection = "ble"

# Dongle (central). keyboard.toml requires a matrix on every split board, so the
# dongle gets a 1x1 dummy matrix on D0/D1. Leave unwired, or put a button + diode
# between D1 (col) and D0 (row) if you want a key there.
[split.central]
rows = 1
cols = 1
row_offset = 4
col_offset = 0

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_02"]
col_pins = ["P0_03"]

# DEBO OLED2 0.96 (SSD1306, 128x64, I2C 0x3C): VCC->3V3, GND->GND, SDA->D4, SCL->D5
[split.central.display]
driver = "ssd1306"
size = "128x64"
rotation = 0
renderer = "OledRenderer"
min_render_interval = 33

[split.central.display.protocol.i2c]
instance = "TWISPI0"
sda = "P0_04"
scl = "P0_05"
address = 0x3C

# Left half (peripheral 0). col2row (RMK default) like the ZMK shield.
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]        # D0 D1 D2 D3
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"] # D4 D5 D10 D9 D8

# Right half (peripheral 1). Columns reversed, like totem_right.overlay.
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]        # D0 D1 D2 D3
col_pins = ["P1_13", "P1_14", "P1_15", "P0_05", "P0_04"] # D8 D9 D10 D5 D4

[ble]
enabled = true

[storage]
# Set to true for ONE flash when coming from ZMK (wipes old bonds/settings),
# then set back to false and flash again.
clear_storage = false

# ───────────────────────── Behavior ─────────────────────────

[rmk]
combo_max_num = 8
combo_max_length = 4

# ZMK &mt: tapping-term 200ms, tap-preferred, quick-tap 150ms, global-quick-tap.
#   tap-preferred     -> normal mode (hold only after the timeout)
#   quick-tap-ms      -> quick_tap_timeout
#   global-quick-tap  -> flow tap with prior_idle_time
[behavior.morse]
enable_flow_tap = false
prior_idle_time = "150ms"
hold_timeout = "200ms"
gap_timeout = "200ms"

[behavior.morse.profiles]
# Home-row mods (all &mt keys)
#   permissive_hold: mod + other key pressed AND released while the mod is still
#     held -> mod (no need to wait 200ms for Ctrl+C etc.)
#   unilateral_tap: a roll with a key on the SAME hand -> always the letter, so
#     mods only fire for keys on the other hand (urob-style "positional" HRM).
#     For same-hand shortcuts hold the mod past hold_timeout, or use the other hand.
#   enable_flow_tap + prior_idle_time (150ms, above): fast typing -> always letters.
HRM = { enable_flow_tap = true, permissive_hold = true, unilateral_tap = true, hold_timeout = "200ms", gap_timeout = "200ms", quick_tap_timeout = "150ms" }
# Layer thumbs (LT keys): the layer turns on as soon as another key is pressed
# while the thumb is down (hold_on_other_press), no 200ms wait.
THUMB = { hold_on_other_press = true, hold_timeout = "200ms", gap_timeout = "200ms" }
# Space thumb: same, plus flow tap, so Space pressed while typing (within
# prior_idle_time = 150ms of the previous key) is always a plain Space. Without
# this, rolling "Space -> next letter" would hit the f_and_arr layer instead.
THUMB_SPACE = { hold_on_other_press = true, enable_flow_tap = true, hold_timeout = "200ms", gap_timeout = "200ms" }

# ZMK combos are position based; RMK combos match the key actions, so the
# actions below are exactly what sits at those positions on the base layer.
# RMK has one global timeout (ZMK had 50ms for Esc, 100ms for left Enter).
[behavior.combo]
timeout = "50ms"
combos = [
  # Q + W -> Esc
  { actions = ["Q", "W"], output = "Escape" },
  # R + S + T -> Enter
  { actions = ["MT(R, LAlt, HRM)", "MT(S, LShift, HRM)", "MT(T, LCtrl, HRM)"], output = "Enter" },
  # N + E + I -> Enter
  { actions = ["MT(N, RCtrl, HRM)", "MT(E, RShift, HRM)", "MT(I, LAlt, HRM)"], output = "Enter" },
  # qwerty layer: S + D + F / J + K + L -> Enter (same positions as R+S+T / N+E+I)
  { actions = ["MT(S, LAlt, HRM)", "MT(D, LShift, HRM)", "MT(F, LCtrl, HRM)"], output = "Enter" },
  { actions = ["MT(J, RCtrl, HRM)", "MT(K, RShift, HRM)", "MT(L, LAlt, HRM)"], output = "Enter" },
  # both outer pinky keys -> Caps Lock (right one is now RShift so the two differ)
  { actions = ["LShift", "RShift"], output = "CapsLock" },
]

# ───────────────────────── Keymap ─────────────────────────
# ZMK -> RMK: &kp X -> X, &mt M K -> MT(K, M, HRM), &lt n K -> LT(n, K),
# &mo/&to n -> MO/TO(n), &none -> No, &trans -> _, &caps_word -> CapsWordToggle

[[keymap.layer]]
name = "c_base"
# Home-row mods in GASC order (pinky -> index): Gui, Alt, Shift, Ctrl, mirrored
# (same as the qwerty layer). Both home-row Alts are LAlt (real Alt).
# AltGr (RAlt) moved to the bottom row, ring finger: hold X or Dot.
keys = """
         Q                  W                  F                   P                  G            J          L                  U                   Y                  Insert
         MT(A, LGui, HRM)   MT(R, LAlt, HRM)   MT(S, LShift, HRM)  MT(T, LCtrl, HRM)  D            H          MT(N, RCtrl, HRM)  MT(E, RShift, HRM)  MT(I, LAlt, HRM)   MT(O, RGui, HRM)
  LShift Z                  MT(X, RAlt, HRM)   C                   V                  B            K          M                  Comma               MT(Dot, RAlt, HRM) Escape  RShift
                                               LT(5, Delete, THUMB) Backspace        LT(1, Enter, THUMB) LT(2, Tab, THUMB) LT(4, Space, THUMB_SPACE) MO(3)
"""

[[keymap.layer]]
name = "brackets"
# &kt LEFT_GUI (key toggle) has no RMK equivalent -> plain LGui for now
keys = """
         Kc1             Kc2          Kc3                   Kc4             Kc5              Kc6          Kc7             Kc8                    Kc9           Kc0
         Quote           LeftBracket  SHIFTED(LeftBracket)  SHIFTED(Kc9)    SHIFTED(Comma)   SHIFTED(Dot) SHIFTED(Kc0)    SHIFTED(RightBracket)  RightBracket  SHIFTED(Quote)
  LShift CapsWordToggle  No           Home                  No              LGui             No           No              Semicolon              SHIFTED(Semicolon) TO(0) RShift
                                      No                    _               No               _            TO(1)           Enter
"""

[[keymap.layer]]
name = "sym_rest"
# '-' only on the right (between = and +), "'" only on the brackets layer.
keys = """
     No              No     No              No                  No           No     No     No     No              No
     SHIFTED(Slash)  No     SHIFTED(Minus)  SHIFTED(Backslash)  Backslash    Slash  Equal  Minus  SHIFTED(Equal)  No
  _  No              No     No              No                  No           No     No     No     No              TO(0) _
                            No              TO(2)               Delete       No     _      No
"""

[[keymap.layer]]
name = "sym_top"
keys = """
     No            No            No            No            No              No            No            No            No     No
     SHIFTED(Kc1)  SHIFTED(Kc2)  SHIFTED(Kc3)  SHIFTED(Kc4)  SHIFTED(Kc5)    SHIFTED(Kc6)  SHIFTED(Kc7)  SHIFTED(Kc8)  Grave  No
  _  No            No            No            No            No              No            No            No            No     TO(0) _
                                 No            TO(3)         No              No            No            No
"""

[[keymap.layer]]
name = "f_and_arr"
# No extra mods here: they come from the home-row mods, held BEFORE the Space thumb.
#   Ctrl+Shift+Left = hold N + E (right hand), hold Space, tap Left
#   Alt+F4          = hold R (left hand), hold Space, tap F4
keys = """
     No  No    Up     No     No     F10  F7  F8  F9  No
     No  Left  Down   Right  No     F11  F4  F5  F6  No
  _  No  No    No     No     No     F12  F1  F2  F3  TO(0) _
               No     TO(4)  No     No   No  No
"""

[[keymap.layer]]
name = "numpad"
keys = """
     No  No     No     No     No       No        Kp7    Kp8  Kp9  No
     No  TO(5)  TO(6)  No     No       PageUp    Kp4    Kp5  Kp6  No
  _  No  TO(1)  TO(2)  TO(4)  No       PageDown  Kp1    Kp2  Kp3  TO(0) _
                No     No     No       No        TO(5)  Kp0
"""

[[keymap.layer]]
name = "qwerty"
# Home-row mods in GASC order (pinky -> index): Gui, Alt, Shift, Ctrl, mirrored.
# Both Alts are LAlt (a real Alt, not AltGr); AltGr = hold X or Dot, as on c_base. The ; position keeps Insert as its
# tap (the old ZMK "&mt INSERT RIGHT_GUI" tapped Insert too), now with RGui on hold.
# Right outer pinky is RShift (was LShift) so the LShift+RShift Caps Lock combo works here too.
# Thumbs are identical to c_base.
keys = """
         Q                  W                  E                    R                  T       Y       U                  I                    O                  P
         MT(A, LGui, HRM)   MT(S, LAlt, HRM)   MT(D, LShift, HRM)   MT(F, LCtrl, HRM)  G       H       MT(J, RCtrl, HRM)  MT(K, RShift, HRM)   MT(L, LAlt, HRM)   MT(Insert, RGui, HRM)
  LShift Z                  MT(X, RAlt, HRM)   C                    V                  B       N       M                  Comma                MT(Dot, RAlt, HRM) TO(0)  RShift
                              LT(5, Delete, THUMB) Backspace       LT(1, Enter, THUMB) LT(2, Tab, THUMB) LT(4, Space, THUMB_SPACE) MO(3)
"""
